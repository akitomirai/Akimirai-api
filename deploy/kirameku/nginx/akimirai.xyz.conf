server {
    listen 80;
    listen [::]:80;
    server_name akimirai.xyz www.akimirai.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 308 https://akimirai.xyz$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.akimirai.xyz;

    ssl_certificate /etc/letsencrypt/live/akimirai.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/akimirai.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 308 https://akimirai.xyz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name akimirai.xyz;

    ssl_certificate /etc/letsencrypt/live/akimirai.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/akimirai.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/kirameku.access.log;
    error_log /var/log/nginx/kirameku.error.log;

    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /_site_access_verify {
        internal;
        proxy_pass http://127.0.0.1:8000/api/site-access/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @site_access_login {
        return 302 /access?next=$uri;
    }

    location = /access {
        proxy_pass http://127.0.0.1:3001;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    location = /images/1.webp {
        proxy_pass http://127.0.0.1:3001;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /icon.png {
        proxy_pass http://127.0.0.1:3001;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/site-access/login {
        limit_req zone=kirameku_site_access burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/site-access/logout {
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin {
        return 308 /admin/;
    }

    location ^~ /admin/ {
        auth_request /_site_access_verify;
        error_page 401 = @site_access_login;
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/ {
        auth_request /_site_access_verify;
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location ^~ /uploads/ {
        auth_request /_site_access_verify;
        error_page 401 = @site_access_login;
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        auth_request /_site_access_verify;
        error_page 401 = @site_access_login;
        proxy_pass http://127.0.0.1:3001;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_cache off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 30s;
    }
}
